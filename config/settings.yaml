# Global pipeline settings
pipeline:
  name: "NewsletterAgent"
  version: "0.1.0"
  # Maximum number of articles to process per run
  max_articles_per_run: 50
  # Maximum articles in final newsletter
  max_articles_in_newsletter: 12
  # Minimum relevance score to pass scoring gate (0.0 - 1.0)
  min_relevance_score: 0.4
  # Minimum quality score to pass quality gate (0.0 - 1.0)
  min_quality_score: 0.5
  # Enable deduplication across runs
  dedup_enabled: true
  # Lookback window for dedup (days)
  dedup_lookback_days: 7
  # Produce one synthesis-heavy feature article/day instead of digest sections
  single_feature_mode: false
  # Number of top-scored items to pass into clustering stage
  single_feature_top_k: 8
  # Minimum number of items required in selected thematic cluster
  single_feature_min_cluster_size: 3

llm:
  # Primary (cloud/API) model identifier
  model: "claude-sonnet-4-20250514"
  # Claude Code CLI model alias (uses your local Claude auth)
  cli_model: "sonnet"
  max_tokens: 4096
  temperature: 0.3
  # Provider routing for article production
  local:
    provider: "claude_cli"
    base_url: "http://localhost:11434"
    summarizer_model: "mistral-small"
    editor_model: "llama3.1:8b"
    mem0_llm_model: "llama3.1:8b"
    temperature: 0.3
    max_tokens: 2048

scoring:
  # Composite score weighting per scoring dimension
  dimension_weights:
    relevance: 0.25
    quality: 0.25
    timeliness: 0.20
    uniqueness: 0.15
    source_authority: 0.15

memory:
  # Enable cross-run memory via Mem0
  enabled: true
  # Vector store for local open-source mode (ignored when MEM0_API_KEY is set)
  vector_store:
    provider: "qdrant"
    # Dimension-scoped collection/path avoids collisions with legacy 1536-dim stores.
    collection_name: "newsletter_agent_768d_v2"
    path: ".mem0/qdrant_768d_v2"
  # Similarity threshold for cross-run dedup (0.0 - 1.0)
  dedup_threshold: 0.85

scheduling:
  # Cron expression for daily run
  cron: "0 6 * * *"
  timezone: "America/New_York"

output:
  # Supported formats: html, markdown, plaintext
  default_format: "html"
  template_dir: "config/templates"
  google_sheets:
    enabled: false
    sheet_id: ""
    worksheet: "articles"
    service_account_json: ""
