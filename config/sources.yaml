# Source registry — feeds and APIs the collector agent pulls from
sources:
  rss_feeds:
    - name: "Hacker News"
      url: "https://hnrss.org/frontpage"
      category: "tech"
      reliability: 0.7
      refresh_minutes: 30

    - name: "TechCrunch"
      url: "https://techcrunch.com/feed/"
      category: "tech"
      reliability: 0.8
      refresh_minutes: 60

    - name: "Ars Technica"
      url: "https://feeds.arstechnica.com/arstechnica/index"
      category: "tech"
      reliability: 0.85
      refresh_minutes: 60

    - name: "The Verge"
      url: "https://www.theverge.com/rss/index.xml"
      category: "tech"
      reliability: 0.75
      refresh_minutes: 60

    - name: "MIT Technology Review"
      url: "https://www.technologyreview.com/feed/"
      category: "research"
      reliability: 0.9
      refresh_minutes: 120

    - name: "AI News (Hugging Face)"
      url: "https://huggingface.co/blog/feed.xml"
      category: "ai"
      reliability: 0.85
      refresh_minutes: 120

  apis:
    - name: "NewsAPI"
      type: "newsapi"
      enabled: false
      category: "general"
      reliability: 0.7
      query_topics:
        - "artificial intelligence"
        - "machine learning"
        - "technology startups"

    - name: "Reddit Tech"
      type: "reddit"
      enabled: false
      subreddits:
        - "technology"
        - "MachineLearning"
        - "programming"
      reliability: 0.6
      min_upvotes: 100

# Source category weights for scoring
category_weights:
  tech: 1.0
  ai: 1.2
  research: 1.1
  general: 0.8
  business: 0.9
