# Source registry — focused on law firm SEO, marketing, and legal tech intelligence
sources:
  rss_feeds:
    - name: "Search Engine Land"
      url: "https://searchengineland.com/feed"
      category: "seo"
      reliability: 0.9
      refresh_minutes: 60

    - name: "Search Engine Journal"
      url: "https://www.searchenginejournal.com/feed/"
      category: "seo"
      reliability: 0.85
      refresh_minutes: 60

    - name: "Google Search Central Blog"
      url: "https://developers.google.com/search/blog/rss.xml"
      category: "seo"
      reliability: 0.95
      refresh_minutes: 120

    - name: "LawNext"
      url: "https://www.lawnext.com/feed"
      category: "legal_tech"
      reliability: 0.9
      refresh_minutes: 120

    - name: "Artificial Lawyer"
      url: "https://www.artificiallawyer.com/feed/"
      category: "legal_tech"
      reliability: 0.85
      refresh_minutes: 120

    - name: "Clio Blog"
      url: "https://www.clio.com/blog/feed/"
      category: "legal_marketing"
      reliability: 0.85
      refresh_minutes: 180

    - name: "ABA Journal"
      url: "https://www.abajournal.com/rss/news.rss"
      category: "industry"
      reliability: 0.85
      refresh_minutes: 180

    - name: "Google Ads Blog"
      url: "https://blog.google/products/ads-commerce/rss/"
      category: "marketing"
      reliability: 0.9
      refresh_minutes: 180

  apis:
    - name: "NewsAPI"
      type: "newsapi"
      enabled: false
      category: "general"
      reliability: 0.7
      query_topics:
        - "law firm seo"
        - "legal marketing"
        - "legal tech ai"
        - "google algorithm update"

# Source category weights for scoring
category_weights:
  seo: 1.2
  legal_marketing: 1.2
  legal_tech: 1.15
  marketing: 1.0
  industry: 0.95
  general: 0.8
