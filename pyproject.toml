[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsletter-agent"
version = "0.1.0"
description = "AI-powered newsletter generation agent with multi-stage pipeline"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NewsletterAgent Team" }]

dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
memory = [
    "mem0ai>=0.1.0",
]

[project.scripts]
newsletter = "scripts.cli:main"
newsletter-run = "scripts.run_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "models",
    "engine",
    "pipeline",
    "scoring",
    "policy",
    "retrieval",
    "audit_log",
    "memory",
    "scripts",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
